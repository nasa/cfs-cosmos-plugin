[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosmos_test_utils"
version = "0.7.3"
authors = [
    {name = "Damon Stewart", email = "damon.stewart@nasa.gov"}
]
description = "Test utilities for testing systems that run with the OpenC3 COSMOS ground system"
readme = "README.md"
requires-python = ">=3.6"
dependencies = [
    "openc3>=5.0.0"
]

