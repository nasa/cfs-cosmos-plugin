[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosmos_test_utils"
version = "1.0.2"
authors = [
    {name = "Damon Stewart", email = "damon.stewart@nasa.gov"}
]
description = "Test utilities for testing systems that run with the OpenC3 COSMOS ground system"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "openc3>=5.0.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["testing", "utilities", "openc3", "COSMOS"]

#[project.urls]
#Homepage = ""  # Repository URL

[tool.hatch.build]
packages = ["cosmos_test_utils"]
